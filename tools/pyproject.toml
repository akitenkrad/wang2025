[project]
name = "culture-llm-tools"
version = "0.1.0"
description = "YuLan-OneSim (Wang et al. 2025) Axelrod culture-dissemination — visualization & analysis tools"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "socsim-tools",
]

[project.scripts]
culture-llm-tools = "culture_llm_tools.cli:main"

[tool.uv.sources]
socsim-tools = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", subdirectory = "tools/socsim_tools" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/culture_llm_tools"]
