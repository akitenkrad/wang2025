[package]
name = "culture-llm-simulation"
version = "0.1.0"
edition = "2021"

[lib]
name = "culture_llm"
path = "src/lib.rs"

[[bin]]
name = "culture-llm"
path = "src/main.rs"

[dependencies]
rand        = { version = "0.8", features = ["small_rng"] }
csv         = "1.3"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
clap        = { version = "4.5", features = ["derive"] }

# social-simulation framework (socsim) — grid ABM engine foundation.
# The Axelrod culture-dissemination model is a fixed-site CellGrid<Culture>
# model, so it uses core + engine + grid (like axelrod1997), plus the optional
# (feature-gated) LLM helper layer socsim-llm for the LLM-driven variant.
# socsim-llm's "live" feature enables both ollama + openai backends
# (FallbackClient). Concrete commits are pinned in Cargo.lock.
socsim-core   = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", branch = "main", package = "socsim-core" }
socsim-engine = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", branch = "main", package = "socsim-engine" }
socsim-grid   = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", branch = "main", package = "socsim-grid" }
# Reusable social-dynamics mechanism pack — provides the classical Axelrod
# cultural-dissemination mechanism (AxelrodMechanism), which was ported FROM
# this repo's original ClassicalInteractionMechanism. The classical
# (`--provider none`) path wires CultureWorld to this pack via the socsim-core
# CultureVectors + Neighbors capability traits; the LLM path keeps its repo-local
# LLMInteractionMechanism unchanged.
socsim-social-dynamics = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", branch = "main", package = "socsim-social-dynamics" }
socsim-llm    = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", branch = "main", package = "socsim-llm", features = ["live"] }
# Output helpers (timestamp / run-dir / latest symlink / CSV・JSON writer).
# Shared crate that consolidates library-mode boilerplate.
socsim-results = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", branch = "main", package = "socsim-results" }
